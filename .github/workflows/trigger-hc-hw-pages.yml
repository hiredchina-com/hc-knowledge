# 文章内容变更后，通知 hc-hw 构建并发布 Cloudflare Pages。
# 所需 GitHub Secret：HC_HW_DISPATCH_TOKEN（仅授予 hiredchina-com/hc-hw 的仓库 dispatch 权限）。
name: Trigger hc-hw knowledge Pages publish

on:
  push:
    branches: [main]
    paths:
      - "zh/knowledge/**/*.md"
      - "en/knowledge/**/*.md"
      # 文章导航/分类由索引生成，索引随文章改动一同发布。
      - "zh/knowledge-index.json"
      - "en/knowledge-index.json"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Notify hc-hw to publish
        env:
          HC_HW_DISPATCH_TOKEN: ${{ secrets.HC_HW_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          : "${HC_HW_DISPATCH_TOKEN:?缺少 secret HC_HW_DISPATCH_TOKEN}"
          curl --fail-with-body --request POST \
            --url "https://api.github.com/repos/hiredchina-com/hc-hw/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${HC_HW_DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"event_type\":\"knowledge-content-updated\",\"client_payload\":{\"source_repository\":\"${SOURCE_REPOSITORY}\",\"source_sha\":\"${SOURCE_SHA}\"}}"
